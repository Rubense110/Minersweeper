services:
  prom_service:
    container_name: prom_service
    restart: unless-stopped
    build:
      context: .
      dockerfile: java-service/Dockerfile
    ports:
      - "7070:7070"
    environment:
      PORT: 7070
      LOGS_ROOT: /data/logs
      PIPELINE_EVALUATOR_MODE: real
    volumes:
      - ./pm_site/pm_app/logs:/data/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7070/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  optimization_service:
    container_name: optimization_service
    restart: unless-stopped
    build:
      context: .
      dockerfile: optimization-service/Dockerfile
    depends_on:
      prom_service:
        condition: service_healthy
    environment:
      JAVA_SERVICE_URL: http://prom_service:7070
      LOGS_ROOT: /data/logs
      OPTIMIZATION_HOST: 0.0.0.0
      OPTIMIZATION_PORT: 8080
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app/optimization-service
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./pm_site/pm_app/logs:/data/logs
    working_dir: /app/optimization-service
