services:
  postgres:
    image: postgres:16-alpine
    container_name: optimization_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: minersweeper
      POSTGRES_USER: minersweeper
      POSTGRES_PASSWORD: minersweeper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minersweeper -d minersweeper"]
      interval: 10s
      timeout: 5s
      retries: 5

  prom_service:
    image: rubjimjim/minersweeper-mining:develop
    container_name: prom_service
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/mining-service/Dockerfile
    ports:
      - "7070:7070"
    mem_limit: ${PROM_SERVICE_MEM_LIMIT:-10g}
    memswap_limit: ${PROM_SERVICE_MEM_LIMIT:-10g}
    stop_grace_period: 45s
    environment:
      PORT: 7070
      LOGS_ROOT: /data/logs
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC"
      PROM_COORDINATOR_XMX: ${PROM_COORDINATOR_XMX:-256m}
      PROM_WORKER_COUNT: ${PROM_WORKER_COUNT:-1}
      PROM_WORKER_XMX: ${PROM_WORKER_XMX:-${PROM_JAVA_XMX:-8g}}
      PROM_WORKER_NATIVE_RESERVE: ${PROM_WORKER_NATIVE_RESERVE:-1g}
      PROM_WORKER_STARTUP_SECONDS: ${PROM_WORKER_STARTUP_SECONDS:-120}
      PROM_WORKER_QUEUE_SECONDS: ${PROM_WORKER_QUEUE_SECONDS:-30}
      PROM_WORKER_KILL_SECONDS: ${PROM_WORKER_KILL_SECONDS:-10}
      PROM_EVALUATION_TIMEOUT_SECONDS: ${PROM_EVALUATION_TIMEOUT_SECONDS:-300}
      PROM_CANCEL_GRACE_SECONDS: ${PROM_CANCEL_GRACE_SECONDS:-10}
      ARTIFACTS_ROOT: /var/lib/minersweeper/artifacts
      PIPELINE_EVALUATOR_MODE: real
      PROM_VERBOSE_EXCEPTIONS: "true"
      PROM_TIMING_ENABLED: "true"
      PROM_TIMING_SLOW_MS: "0"
      PROM_LOG_CACHE_MAX_EXPERIMENTS: "1"
      PROM_MAX_CONCURRENT_EVALUATIONS: ${PROM_MAX_CONCURRENT_EVALUATIONS:-4}
      PROM_EVALUATION_RESERVE_MB: ${PROM_EVALUATION_RESERVE_MB:-512}
      PROM_PREPROCESS_CACHE_MB: ${PROM_PREPROCESS_CACHE_MB:-256}
      PROM_ALLOW_MINER_MULTITHREADING: ${PROM_ALLOW_MINER_MULTITHREADING:-false}
      PROM_LOG_TO_FILE: "true"
      PROM_LOG_FILE: /var/log/minersweeper/services.log
      PROM_SUPPRESS_PROM_NOISE: "true"
    volumes:
      - ./event_logs:/data/logs
      - ./logs:/var/log/minersweeper
      - prom_artifacts:/var/lib/minersweeper/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7070/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  optimization_service:
    image: rubjimjim/minersweeper-optimization:develop
    container_name: optimization_service
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/optimization-service/Dockerfile
    depends_on:
      prom_service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      JAVA_SERVICE_URL: http://prom_service:7070
      JAVA_SERVICE_TIMEOUT_SECONDS: ${JAVA_SERVICE_TIMEOUT_SECONDS:-660}
      JAVA_CANCEL_GRACE_SECONDS: ${JAVA_CANCEL_GRACE_SECONDS:-30}
      OPT_MAX_CONCURRENT_JOBS: ${OPT_MAX_CONCURRENT_JOBS:-1}
      OPT_MAX_QUEUED_JOBS: ${OPT_MAX_QUEUED_JOBS:-16}
      OPT_MAX_EVALUATION_WORKERS: ${OPT_MAX_EVALUATION_WORKERS:-4}
      OPT_DB_URL: postgresql+psycopg://minersweeper:minersweeper@postgres:5432/minersweeper
      LOGS_ROOT: /data/logs
      OPTIMIZATION_HOST: 0.0.0.0
      OPTIMIZATION_PORT: 8080
      OPTIMIZATION_LOG_LEVEL: INFO
      OPT_LOG_TO_FILE: "true"
      OPT_LOG_FILE: /var/log/minersweeper/services.log
      OPT_LOG_MAX_BYTES: 0
      OPT_LOG_BACKUP_COUNT: 0
      OPT_EVALUATION_TRACE_FILE: /var/log/minersweeper/evaluation_metrics.jsonl
      PROM_SERVICE_REVISION: ${PROM_SERVICE_REVISION:-}
      MODEL_QUALITY_POLICY_VERSION: ${MODEL_QUALITY_POLICY_VERSION:-}
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app/src/optimization-service/src
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./event_logs:/data/logs
      - ./logs:/var/log/minersweeper
    working_dir: /app/src/optimization-service

  frontend_service:
    image: rubjimjim/minersweeper-frontend:develop
    container_name: frontend_service
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/frontend-service/Dockerfile
    depends_on:
      optimization_service:
        condition: service_started
    environment:
      VITE_OPTIMIZATION_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend-service:/app/src/frontend-service
      - frontend_node_modules:/app/src/frontend-service/node_modules
    working_dir: /app/src/frontend-service

volumes:
  frontend_node_modules:
  postgres_data:
  prom_artifacts:
