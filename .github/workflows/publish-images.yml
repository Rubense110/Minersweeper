name: Publish Docker Images

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  publish-images:
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            image: rubjimjim/minersweeper-frontend
            dockerfile: frontend-service/Dockerfile

          - service: optimization
            image: rubjimjim/minersweeper-optimization
            dockerfile: optimization-service/Dockerfile

          - service: mining
            image: rubjimjim/minersweeper-mining
            dockerfile: java-service/Dockerfile

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set Docker image version
        run: echo "IMAGE_VERSION=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ env.IMAGE_VERSION }}
