name: CI

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  optimization-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r src/optimization-service/requirements.txt

      - name: Run optimization service tests
        env:
          PYTHONPATH: src/optimization-service/src
        run: python -m unittest discover -s src/optimization-service/tests -p "test_*.py" -v

  java-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Install ProM dependencies
        run: ./tools/install_prom_jars.sh

      - name: Run Java service tests
        working-directory: src/mining-service
        run: mvn -q test

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: src/frontend-service
        run: npm install

      - name: Build frontend
        working-directory: src/frontend-service
        run: npm run build

  compose-build:
    runs-on: ubuntu-latest
    needs:
      - optimization-tests
      - java-tests
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config

      - name: Build compose services
        run: docker compose build
